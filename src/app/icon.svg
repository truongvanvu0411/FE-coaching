<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FE Coach">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- Progress arc, echoing the accuracy ring on the dashboard. Drawn as a stroked
       circle with a dash gap so it reads as "partly complete" rather than a plain
       outline, and it survives down to 16px as a simple blue-on-white curve. -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="92.4 131.9" transform="rotate(-90 32 32)"/>
  <!-- The tick sits inside the ring: verified answers are the product's whole
       point, and a checkmark stays legible at favicon size where letterforms blur. -->
  <path d="M23 32.5 L29.5 39 L42 26" fill="none" stroke="#FFFFFF" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
